; RoboCup SSL ロボット UI (XIAO RP2040 + ILI9341 2.8" TFT + XPT2046 タッチ)
; MainBoard_V26_2 と UART で接続 (プロトコル: include/ui_protocol.h)

[platformio]
default_envs = seeed_xiao_rp2040

[env:seeed_xiao_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 133000000L
monitor_speed = 115200
build_src_filter = +<*> -<diag/>

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI の設定 (User_Setup.h を使わず build_flags で指定)
; ピン番号は RP2040 の GPIO 番号 (回路図 UI シート: XIAO D0-D10 → GPIO)
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_SCLK=2       ; D8  SCK
    -D TFT_MOSI=3       ; D10 MOSI
    -D TFT_MISO=4       ; D9  MISO (タッチ T_DOUT のみ。LCD の SDO は未接続)
    -D TFT_CS=1         ; D7  LED_CS
    -D TFT_DC=27        ; D1  D/C
    -D TFT_RST=26       ; D0  Reset
    -D TOUCH_CS=6       ; D4  T_CS
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D DISABLE_ALL_LIBRARY_WARNINGS=1

; LCD 診断用 (TFT_eSPI を使わず SPI 速度を変えて単色表示): pio run -e lcd_diag -t upload
[env:lcd_diag]
extends = env:seeed_xiao_rp2040
lib_deps =
build_flags =
build_src_filter = -<*> +<diag/>
